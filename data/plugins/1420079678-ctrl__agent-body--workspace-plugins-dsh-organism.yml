description:
  zh: "器官化内核：把每个插件升格为「器官」（统一感知→反射→效应→稳态契约），并给整具身体装上神经总线、心跳泵、反射弧、自愈账本与按需显影的工具 schema 门控。12 个工具：body_map / body_cell / body_status / body_heart / body_law / body_nerve / body_call / body_reflex / body_heal / body_skill / body_organ / body_pulse。心跳按可变间期把指令与体征泵向全身、器官可回血；失败走「确定性归因→处方→复检」闭环，伤口只在器官下次成功时闭合（参数错误绝不自动重试）；同一「工具×病因」失败 3 次会自动生成反射弧；跨器官链路跑通即固化为可重放技能；工具 schema 按本轮意图显影，其余能力经 body_call 一步可达。零外部依赖。"
  en: "Organism kernel: promotes every plugin to an organ behind one contract (sense → reflex → effect → homeostasis) and mounts a nerve bus, a heartbeat pump, reflex arcs, a self-healing ledger and on-demand tool-schema gating. 12 tools: body_map / body_cell / body_status / body_heart / body_law / body_nerve / body_call / body_reflex / body_heal / body_skill / body_organ / body_pulse. A heartbeat with a variable interval pumps directives and vitals through the body, and organs can return blood upstream. Failures take a deterministic loop (attribute → prescribe → re-check) and a wound closes only when that organ next succeeds; argument errors are never auto-retried. The same tool × cause failing three times makes the system author its own reflex arc, and a cross-organ chain that completes is fixed into a replayable skill. Tool schemas are gated per turn; everything else stays one body_call away. Zero external dependencies."
